scope = "rig"
provider = "codex"
option_defaults = { model = "gpt-5.4" }
wake_mode = "fresh"
work_dir = "{{.WorktreesRoot}}/gascity/{{.Rig}}/crew/{{.AgentBase}}"
nudge = "Check mail and hook status, then act accordingly."
pre_start = [
  "{{.ConfigDir}}/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync",
]
idle_timeout = "2h"
max_active_sessions = 1
session_live = [
  "{{.ConfigDir}}/scripts/tmux-theme.sh {{.Session}} {{.Agent}} {{.ConfigDir}}",
  "{{.ConfigDir}}/scripts/tmux-keybindings.sh {{.ConfigDir}}",
]
