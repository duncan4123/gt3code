scope = "city"
provider = "codex"
option_defaults = { model = "gpt-5.5" }
wake_mode = "resume"
work_dir = ".gc/worktrees/hq-polecats/{{.AgentBase}}"
pre_start = [
  "{{.ConfigDir}}/assets/scripts/worktree-setup.sh \"$(cd '{{.CityRoot}}/../../../..' && pwd)\" {{.WorkDir}} {{.AgentBase}} --sync",
]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 5
