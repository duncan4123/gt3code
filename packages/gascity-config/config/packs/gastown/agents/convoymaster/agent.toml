scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/convoymaster"
nudge = "Check convoys, mail, and ready work; then coordinate."
idle_timeout = "2h"
max_active_sessions = 1
session_live = [
  "{{.ConfigDir}}/scripts/tmux-theme.sh {{.Session}} {{.Agent}} {{.ConfigDir}}",
  "{{.ConfigDir}}/scripts/tmux-keybindings.sh {{.ConfigDir}}",
]
