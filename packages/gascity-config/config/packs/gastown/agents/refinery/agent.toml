scope = "rig"
provider = "kimi-for-coding"
option_defaults = { model = "kimi-for-coding/k2p6", agent = "build" }
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/refinery"
nudge = "Run 'gc prime' to check merge queue and begin processing."
pre_start = [
  "{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync",
]
idle_timeout = "2h"
max_active_sessions = 1
