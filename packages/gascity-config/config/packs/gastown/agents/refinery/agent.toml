scope = "rig"
provider = "kimi-for-coding"
option_defaults = { model = "kimi-for-coding/k2p6", agent = "build" }
wake_mode = "fresh"
work_dir = "{{.WorktreesRoot}}/gascity/{{.Rig}}/refinery"
nudge = "Run 'gc prime' to check merge queue and begin processing."
pre_start = [
  "{{.ConfigDir}}/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync",
]
idle_timeout = "2h"
max_active_sessions = 1
session_live = [
  "{{.ConfigDir}}/scripts/tmux-theme.sh {{.Session}} {{.Agent}} {{.ConfigDir}}",
  "{{.ConfigDir}}/scripts/tmux-keybindings.sh {{.ConfigDir}}",
]
