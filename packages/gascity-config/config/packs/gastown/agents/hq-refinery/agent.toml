scope = "city"
wake_mode = "fresh"
work_dir = ".gc/worktrees/hq-refinery"
nudge = "Run 'gc prime' to check the HQ merge queue and begin processing."
scale_check = "printf 0"
pre_start = [
  "{{.ConfigDir}}/assets/scripts/worktree-setup.sh \"$(cd '{{.CityRoot}}/../../../..' && pwd)\" {{.WorkDir}} {{.AgentBase}} --sync",
]
idle_timeout = "2h"
max_active_sessions = 1

