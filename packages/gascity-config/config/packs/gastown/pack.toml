# Gas Town — domain-specific coding workflow pack.
#
# Gastown roles: mayor (coordinator), deacon (patrol), boot (watchdog),
# workspace-scoped HQ agents, plus rig-scoped agents (witness, refinery, crew,
# polecat).
# Dog (utility pool) is defined here with tmux theming; maintenance provides
# the fallback (unthemed) dog. Mechanical housekeeping lives in maintenance.
#
# Referenced by both workspace.pack and rigs[].pack:
#   workspace.pack → expands city-scoped agents only (mayor, deacon, boot,
#                     hq-witness, hq-polecat, hq-refinery)
#   rigs[].pack    → expands rig agents only (witness, refinery, crew, polecat)

[pack]
name = "gastown"
schema = 2

[imports.maintenance]
source = "../maintenance"

[global]
session_live = [
  "{{.ConfigDir}}/assets/scripts/tmux-theme.sh {{.Session}} {{.Agent}} {{.ConfigDir}}",
  "{{.ConfigDir}}/assets/scripts/tmux-keybindings.sh {{.ConfigDir}}",
]

[[patches.agent]]
name = "dog"
provider = "codex"
wake_mode = "fresh"
min_active_sessions = 1
work_dir = ".gc/agents/dogs/{{.AgentBase}}"

[[named_session]]
template = "mayor"
scope = "city"
mode = "always"

[[named_session]]
template = "deacon"
scope = "city"
mode = "always"

[[named_session]]
template = "boot"
scope = "city"
mode = "always"

[[named_session]]
template = "hq-witness"
scope = "city"
mode = "always"

[[named_session]]
template = "hq-refinery"
scope = "city"
mode = "on_demand"

[[named_session]]
template = "witness"
scope = "rig"
mode = "always"

[[named_session]]
template = "refinery"
scope = "rig"
mode = "on_demand"

[[named_session]]
template = "crew"
scope = "rig"
mode = "always"

[[named_session]]
template = "convoymaster"
scope = "rig"
mode = "on_demand"
