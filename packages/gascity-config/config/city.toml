[workspace]
name = "t3code"
suspended = false
global_fragments = ["command-glossary", "operational-awareness-doltlite"]

[[rigs]]
name = "gascity"
suspended = false
includes = ["packs/gastown"]

[[rigs.overrides]]
agent = "convoymaster"
suspended = false

[[rigs.overrides]]
agent = "crew"
suspended = false

[[rigs.overrides]]
agent = "polecat"
suspended = false

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "witness"
suspended = false

[[rigs]]
name = "beads-doltlite"
prefix = "bd"
suspended = false
includes = ["packs/gastown"]

[[rigs]]
name = "context-mode"
prefix = "ccm"
suspended = true
includes = ["packs/gastown"]


[[rigs.overrides]]
agent = "convoymaster"
suspended = true

[[rigs.overrides]]
agent = "crew"
suspended = true

[[rigs.overrides]]
agent = "polecat"
suspended = true

[[rigs.overrides]]
agent = "refinery"
suspended = true

[[rigs.overrides]]
agent = "witness"
suspended = true
[patches]

[[patches.agent]]
dir = ""
name = "mayor"
suspended = false
provider = "codex"
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "deacon"
suspended = false
provider = "codex"

[[patches.agent]]
dir = ""
name = "boot"
suspended = false
provider = "opencode"
[patches.agent.option_defaults]
model = "kimi-for-coding/k2p6"

[[patches.agent]]
dir = ""
name = "dog"
suspended = false
provider = "codex"
[patches.agent.env]
GC_MODEL = "gpt-5.4-mini"

[[patches.agent]]
dir = "gascity"
name = "crew"
suspended = false

[[patches.agent]]
dir = "context-mode"
name = "witness"
suspended = false

[[patches.agent]]
dir = ""
name = "gastown.mayor"
suspended = false

[[patches.agent]]
dir = "beads-doltlite"
name = "polecat"
wake_mode = "resume"

[[patches.named_session]]
template = "mayor"
mode = "on_demand"

[[patches.named_session]]
template = "deacon"
mode = "always"

[[patches.named_session]]
template = "boot"
mode = "always"

[[patches.named_session]]
dir = "gascity"
template = "refinery"
mode = "always"

[beads]
provider = "bd"
backend = "doltlite"

[session]
provider = "t3bridge"

[daemon]
formula_v2 = true
graph_workflows = true
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"

[orders]
skip = ["spawn-storm-detect", "orphan-sweep", "cross-rig-deps", "gate-sweep", "wisp-compact", "prune-branches", "mol-dog-jsonl", "mol-dog-reaper", "doltlite-compact", "digest-generate", "dolt-health", "dolt-remotes-patrol", "mol-dog-stale-db", "mol-dog-phantom-db", "mol-dog-compactor", "mol-dog-backup", "mol-dog-doctor", "beads-health"]

[api]
port = 8372
