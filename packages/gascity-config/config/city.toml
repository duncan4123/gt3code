[workspace]
suspended = false
global_fragments = ["command-glossary", "operational-awareness"]

[[rigs]]
name = "gascity"
suspended = false
includes = ["packs/gastown"]

[[rigs.overrides]]
agent = "polecat"
suspended = false

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "witness"
suspended = false

[[rigs]]
name = "beads-doltlite"
prefix = "bd"
suspended = false
includes = ["packs/gastown"]

[[rigs.overrides]]
agent = "polecat"
suspended = false

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "witness"
suspended = false

[[rigs]]
name = "context-mode"
prefix = "ccm"
suspended = true
includes = ["packs/gastown"]

[[rigs.overrides]]
agent = "polecat"
suspended = false

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "witness"
suspended = false

[patches]

[[patches.agent]]
dir = ""
name = "mayor"
suspended = false
provider = "codex"
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "deacon"
suspended = false
provider = "codex"

[[patches.agent]]
dir = ""
name = "boot"
suspended = false
provider = "kimi-for-coding"

[patches.agent.option_defaults]
agent = "build"
model = "kimi-for-coding/k2p6"

[[patches.agent]]
dir = ""
name = "dog"
suspended = false
provider = "codex"

[patches.agent.env]
GC_MODEL = "gpt-5.4-mini"

[[patches.agent]]
dir = "gascity"
name = "refinery"
suspended = false

[[patches.agent]]
dir = "gascity"
name = "witness"
suspended = false

[[patches.agent]]
dir = "beads-doltlite"
name = "polecat"
suspended = false
wake_mode = "fresh"

[[patches.agent]]
dir = "context-mode"
name = "witness"
suspended = false

[[patches.named_session]]
template = "mayor"
mode = "always"

[[patches.named_session]]
template = "deacon"
mode = "always"

[[patches.named_session]]
template = "boot"
mode = "always"

[[patches.named_session]]
dir = "gascity"
template = "refinery"
mode = "always"

[[patches.named_session]]
dir = "beads-doltlite"
template = "refinery"
mode = "always"

[[patches.named_session]]
dir = "context-mode"
template = "refinery"
mode = "always"
