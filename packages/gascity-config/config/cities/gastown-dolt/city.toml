[workspace]
provider = "deepseek"
global_fragments = ["command-glossary", "operational-awareness"]

[[rigs]]
name = "t3code"
prefix = "t3c"
[rigs.imports]
[rigs.imports.gastown]
source = "../../packs/gastown-upstream"

[[rigs]]
name = "beadstui"
prefix = "btui"
suspended = true
[rigs.imports]
[rigs.imports.gastown]
source = "../../packs/gastown-upstream"

[[rigs.overrides]]
agent = "witness"
suspended = false

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "polecat"
suspended = false

[patches]

[[patches.agent]]
dir = ""
name = "gastown.mayor"
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "gastown.deacon"
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "gastown.boot"
provider = "deepseek"
wake_mode = "resume"
[patches.agent.option_defaults]
model = "deepseek/deepseek-v4-flash"

[[patches.agent]]
dir = "t3code"
name = "gastown.witness"
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "gastown.refinery"
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "gastown.polecat"
wake_mode = "resume"
min_active_sessions = 1

[[patches.agent]]
dir = "beadstui"
name = "gastown.witness"
wake_mode = "resume"

[[patches.agent]]
dir = "beadstui"
name = "gastown.refinery"
wake_mode = "resume"

[[patches.agent]]
dir = "beadstui"
name = "gastown.polecat"
wake_mode = "resume"

[[patches.agent]]
dir = "beadstui"
name = "gastown.polecat"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "dog"
provider = "deepseek"
wake_mode = "fresh"
min_active_sessions = 1
[patches.agent.option_defaults]
model = "deepseek/deepseek-v4-flash"

[session]
provider = "t3bridge"
startup_timeout = "2m"
nudge_ready_timeout = "30s"

[daemon]
formula_v2 = true
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"

[orders]
skip = ["beads-health", "cross-rig-deps", "digest-generate", "dolt-health", "dolt-remotes-patrol", "doltlite-compact", "gate-sweep", "mol-dog-backup", "mol-dog-compactor", "mol-dog-doctor", "mol-dog-jsonl", "mol-dog-phantom-db", "mol-dog-reaper", "mol-dog-stale-db", "orphan-sweep", "prune-branches", "spawn-storm-detect", "wisp-compact"]

[agent_defaults]
model = "deepseek/deepseek-v4-flash"


[[patches.agent]]
dir = "t3code"
name = "polecat"
max_active_sessions = 7