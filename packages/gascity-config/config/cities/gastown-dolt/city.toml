[workspace]
name = "gastown-dolt"
provider = "codex"
global_fragments = ["command-glossary", "operational-awareness"]

[[rigs]]
name = "t3code"
path = "/data/projects/t3code/.t3-dev/workspaces/t3code/live"
prefix = "t3"
[rigs.imports]
[rigs.imports.gastown]
source = "../../packs/gastown-upstream"

[[rigs]]
name = "beadstui"
path = "/data/projects/t3code/.t3-dev/workspaces/t3code/live/packages/gascity-config/config/cities/gastown-dolt/rigs/beadstui"
prefix = "btui"
[rigs.imports]
[rigs.imports.gastown]
source = "../../packs/gastown-upstream"

[[rigs.overrides]]
agent = "witness"
suspended = false

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "polecat"
suspended = false

[patches]

[[patches.agent]]
dir = ""
name = "gastown.mayor"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "gastown.deacon"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "gastown.boot"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "gastown.witness"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "gastown.refinery"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "gastown.polecat"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "gastown.merger"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "beadstui"
name = "gastown.witness"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "beadstui"
name = "gastown.refinery"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "beadstui"
name = "gastown.polecat"
provider = "deepseek"
wake_mode = "resume"

[[patches.agent]]
dir = "beadstui"
name = "gastown.merger"
provider = "deepseek"
wake_mode = "resume"

[beads]
provider = "bd"
backend = "dolt"

[session]
provider = "t3bridge"

[status]
session_snapshot_timeout = "30s"

[daemon]
formula_v2 = true
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"

[orders]
skip = ["beads-health", "cross-rig-deps", "digest-generate", "dolt-health", "dolt-remotes-patrol", "doltlite-compact", "gate-sweep", "mol-dog-backup", "mol-dog-compactor", "mol-dog-doctor", "mol-dog-jsonl", "mol-dog-phantom-db", "mol-dog-reaper", "mol-dog-stale-db", "orphan-sweep", "prune-branches", "spawn-storm-detect", "wisp-compact"]
