[workspace]
global_fragments = ["command-glossary", "operational-awareness"]

[[rigs]]
name = "gascity"
prefix = "gc"
suspended = true
includes = ["../../packs/doltlite-gastown"]

[[rigs.overrides]]
agent = "polecat"
suspended = true

[[rigs.overrides]]
agent = "refinery"
suspended = true

[[rigs.overrides]]
agent = "witness"
suspended = false

[[rigs]]
name = "beads-doltlite"
prefix = "bd"
suspended = true
includes = ["../../packs/doltlite-gastown"]

[[rigs.overrides]]
agent = "polecat"
suspended = true

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "witness"
suspended = true

[[rigs]]
name = "t3code"
prefix = "t3"
includes = ["../../packs/doltlite-gastown", "packs/jj"]

[[rigs.overrides]]
agent = "polecat"
suspended = false

[[rigs.overrides]]
agent = "refinery"
suspended = false

[[rigs.overrides]]
agent = "witness"
suspended = false

[[rigs.overrides]]
agent = "lander"
suspended = false

[[rigs.overrides]]
agent = "planner"
suspended = false

[[rigs.overrides]]
agent = "sentinel"
suspended = false

[[rigs.overrides]]
agent = "worker"
suspended = false

[[rigs]]
name = "test-rig"
prefix = "tr"
suspended = true
includes = ["../../packs/doltlite-gastown", "packs/jj"]

[[rigs.overrides]]
agent = "polecat"
suspended = true

[[rigs.overrides]]
agent = "refinery"
suspended = true

[[rigs.overrides]]
agent = "witness"
suspended = true

[[rigs.overrides]]
agent = "planner"
suspended = true

[[rigs.overrides]]
agent = "worker"
suspended = true

[[rigs.overrides]]
agent = "lander"
suspended = true

[[rigs.overrides]]
agent = "sentinel"
suspended = true

[patches]

[[patches.agent]]
