[workspace]
global_fragments = ["command-glossary", "operational-awareness"]

[[rigs]]
name = "t3code"
path = "../../../../.."
prefix = "t3"
includes = ["packs/jj"]

[[rigs.overrides]]
agent = "lander"
suspended = false

[[rigs.overrides]]
agent = "planner"
suspended = false

[[rigs.overrides]]
agent = "sentinel"
suspended = false

[[rigs.overrides]]
agent = "worker"
suspended = false

[patches]

[[patches.agent]]
dir = "t3code"
name = "worker"
append_fragments = ["t3code-fork-context"]
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "lander"
append_fragments = ["t3code-fork-context"]
wake_mode = "resume"

[beads]
provider = "bd"
backend = "doltlite"

[session]
provider = "t3bridge"

[status]
session_snapshot_timeout = "30s"

[daemon]
formula_v2 = true

[orders]
skip = ["beads-health", "cross-rig-deps", "digest-generate", "dolt-health", "dolt-remotes-patrol", "doltlite-compact", "gate-sweep", "mol-dog-backup", "mol-dog-compactor", "mol-dog-doctor", "mol-dog-jsonl", "mol-dog-phantom-db", "mol-dog-reaper", "mol-dog-stale-db", "orphan-sweep", "prune-branches", "spawn-storm-detect", "wisp-compact"]
