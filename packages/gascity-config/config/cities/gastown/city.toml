[workspace]
global_fragments = ["command-glossary", "operational-awareness"]

[[rigs]]
name = "t3code"
prefix = "t3"
includes = ["packs/jj"]

[[rigs.overrides]]
agent = "lander"
suspended = false

[[rigs.overrides]]
agent = "planner"
suspended = false

[[rigs.overrides]]
agent = "sentinel"
suspended = false

[[rigs.overrides]]
agent = "worker"
suspended = false

[patches]

[[patches.agent]]
dir = ""
name = "mayor"
suspended = true
provider = "codex"
wake_mode = "resume"
[patches.agent.option_defaults]
model = "gpt-5.5"

[[patches.agent]]
dir = ""
name = "deacon"
suspended = false
provider = "codex"
[patches.agent.option_defaults]
model = "gpt-5.5"

[[patches.agent]]
dir = ""
name = "boot"
suspended = true
provider = "kimi-for-coding"
[patches.agent.option_defaults]
agent = "build"
model = "kimi-for-coding/k2p6"

[[patches.agent]]
dir = ""
name = "dog"
suspended = true
provider = "codex"
[patches.agent.env]
GC_MODEL = "gpt-5.4-mini"
[patches.agent.option_defaults]
model = "gpt-5.4-mini"

[[patches.agent]]
dir = "t3code"
name = "worker"
append_fragments = ["t3code-fork-context"]
wake_mode = "resume"

[[patches.agent]]
dir = "t3code"
name = "lander"
append_fragments = ["t3code-fork-context"]
wake_mode = "resume"

[[patches.agent]]
dir = ""
name = "hq-witness"
wake_mode = "fresh"

[[patches.named_session]]
template = "mayor"
mode = "always"

[[patches.named_session]]
template = "deacon"
mode = "always"

[[patches.named_session]]
template = "boot"
mode = "always"

[beads]
provider = "bd"
backend = "doltlite"

[session]
provider = "t3bridge"

[status]
session_snapshot_timeout = "30s"

[daemon]
formula_v2 = true

[orders]
skip = ["beads-health", "cross-rig-deps", "digest-generate", "dolt-health", "dolt-remotes-patrol", "doltlite-compact", "gate-sweep", "mol-dog-backup", "mol-dog-compactor", "mol-dog-doctor", "mol-dog-jsonl", "mol-dog-phantom-db", "mol-dog-reaper", "mol-dog-stale-db", "orphan-sweep", "prune-branches", "spawn-storm-detect", "wisp-compact"]
