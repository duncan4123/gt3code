[patches.agent.option_defaults]
agent = "build"
model = "kimi-for-coding/k2p6"

[[patches.agent]]
dir = ""
name = "dog"
suspended = true
provider = "codex"
[patches.agent.env]
GC_MODEL = "gpt-5.4-mini"
[patches.agent.option_defaults]
model = "gpt-5.4-mini"

[[patches.agent]]
