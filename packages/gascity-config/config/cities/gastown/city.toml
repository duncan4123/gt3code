name = "refinery"
suspended = true
provider = "kimi-for-coding"
wake_mode = "resume"
[patches.agent.option_defaults]
agent = "build"
model = "kimi-for-coding/k2p6"

[[patches.agent]]
dir = "t3code"
name = "polecat"
suspended = true
