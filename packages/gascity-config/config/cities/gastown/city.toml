provider = "codex"
[patches.agent.option_defaults]
model = "gpt-5.5"

[[patches.agent]]
dir = "gascity"
name = "polecat"
suspended = false
provider = "codex"
[patches.agent.option_defaults]
model = "gpt-5.5"

[[patches.agent]]
