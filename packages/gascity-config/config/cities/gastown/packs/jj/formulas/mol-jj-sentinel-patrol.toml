description = """
JJ sentinel patrol.

Sentinel detects stale workspaces, orphaned worker state, and submitted work
that is no longer making progress. It performs lightweight submitted-change
readiness checks, repairs routing metadata, or escalates.

Use the Doltlite-backed `bd` CLI for bead reads, writes, and metadata.
Sentinel must not run builds or complete test suites; only lander may run those.
"""
formula = "mol-jj-sentinel-patrol"
version = 1
contract = "graph.v2"

[vars]
[vars.worker]
description = "Worker pool suffix"
default = "worker"

[vars.binding_prefix]
description = "Rig binding prefix"
default = ""

[vars.lander]
description = "Lander agent suffix"
default = "lander"

[[steps]]
id = "scan-workspaces"
title = "Scan JJ workspaces"
description = """
From the rig root:

```bash
cd "${GC_RIG_ROOT:?GC_RIG_ROOT required}"
jj workspace list
CITY_NAME=$(basename "${GC_CITY_PATH:-${GC_CITY:-city}}")
RIG_NAME="${GC_RIG:-rig}"
WORKTREES_ROOT="${GC_WORKTREES_DIR:-${T3CODE_WORKTREES_DIR:-}}"
if [ -z "$WORKTREES_ROOT" ]; then
  WORKTREES_ROOT="${T3CODE_HOME:-${GC_CITY_PATH:-${GC_CITY:?GC_CITY_PATH or T3CODE_HOME required}}}/worktrees"
fi
JJ_WORKSPACES_ROOT="${GC_JJ_WORKSPACES_ROOT:-$WORKTREES_ROOT/gascity/$CITY_NAME/$RIG_NAME/jj/workspaces}"
find "$JJ_WORKSPACES_ROOT" -maxdepth 2 -type d 2>/dev/null || true
```

Record any workspace that exists on disk but has no open bead metadata.
Do not delete anything during this step.
"""

[[steps]]
id = "scan-beads"
title = "Scan bead metadata"
needs = ["scan-workspaces"]
description = """
Look for open beads with `work_dir`, `jj_workspace`, or `jj_change` metadata.

For each bead:
- If assigned worker session is gone and `work_dir` exists, return it to the
  worker pool with existing metadata preserved.
- If assigned to sentinel with `work_dir` and `jj_change`, inspect it in
  `verify-submitted-work`.
- If `work_dir` is missing but `jj_change` exists, route to lander for review
  only when the change can still be inspected; otherwise return to worker.
- If both are missing, clear stale JJ metadata and return to worker pool.

Use `bd update --set-metadata gc.routed_to=...` before changing assignee.
"""

[[steps]]
id = "verify-submitted-work"
title = "Verify submitted worker changes"
needs = ["scan-beads"]
description = """
Find one open bead assigned to sentinel with `work_dir` and `jj_change`
metadata:

```bash
WORK=$(bd list --status=open --assignee="${GC_RIG:+$GC_RIG/}{{binding_prefix}}sentinel" --json | jq -r '.[0].id // empty')
if [ -n "$WORK" ]; then
  META=$(bd show "$WORK" --json | jq -c '.metadata // {}')
  WORK_DIR=$(printf '%s' "$META" | jq -r '.work_dir // empty')
  JJ_CHANGE=$(printf '%s' "$META" | jq -r '.jj_change // empty')
fi
```

If there is no submitted bead, continue the patrol.

For a submitted bead, inspect only lightweight state:

```bash
cd "$WORK_DIR"
jj workspace update-stale || true
jj status
jj show "$JJ_CHANGE"
```

Confirm metadata is present, the change is reviewable, and worker notes do not
show forbidden verification such as builds, complete test suites, repo-wide
gates, or broad generated checks. Do not run builds or complete test suites.

If the change is ready for landing review, route it to lander:

```bash
bd update "$WORK" \
  --set-metadata gc.routed_to="${GC_RIG:+$GC_RIG/}{{binding_prefix}}{{lander}}" \
  --assignee="${GC_RIG:+$GC_RIG/}{{binding_prefix}}{{lander}}" \
  --status=open
```

If it needs implementation or metadata repair, set `rejection_reason` and route
it back to the worker pool with existing `work_dir` and `jj_change` preserved.
"""

[[steps]]
id = "continue-loop"
title = "Pour next sentinel patrol"
needs = ["verify-submitted-work"]
description = """
Pour the next sentinel patrol wisp and assign it to yourself:

```bash
NEXT=$(bd mol wisp mol-jj-sentinel-patrol --root-only --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id')
bd update "$NEXT" --assignee="$GC_ALIAS"
```
"""
