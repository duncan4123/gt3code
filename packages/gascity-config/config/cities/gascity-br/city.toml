[workspace]
provider = "codex"
suspended = false
install_agent_hooks = ["codex"]

[agent_defaults]
append_fragments = ["cass-search"]

[[rigs]]
name = "default"
prefix = "gb"
suspended = false
includes = [".gc/system/packs/gastown"]

[patches]

[[patches.agent]]
dir = "default"
name = "polecat"
min_active_sessions = 1
provider = "codex"
wake_mode = "resume"

[[patches.agent]]
dir = "default"
name = "refinery"
provider = "codex"

[[patches.agent]]
dir = "default"
name = "witness"
provider = "codex"

[[patches.named_session]]
dir = "default"
template = "refinery"
mode = "always"

[beads]
provider = "exec:/data/projects/gascity/contrib/beads-scripts/gc-beads-br"

[session]
provider = "t3bridge"

[daemon]
formula_v2 = true
