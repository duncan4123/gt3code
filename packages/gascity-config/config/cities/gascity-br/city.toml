[workspace]
provider = "codex"
suspended = false
install_agent_hooks = ["codex"]

[[rigs]]
name = "beads_rust"
prefix = "gb"
suspended = false
formulas_dir = "formulas"
includes = ["packs/jj"]

[[rigs.overrides]]
agent = "planner"
suspended = false

[[rigs.overrides]]
agent = "worker"
suspended = false

[[rigs.overrides]]
agent = "lander"
suspended = false

[[rigs.overrides]]
agent = "sentinel"
suspended = false

[[rigs]]
name = "t3code"
prefix = "t3"
suspended = false
includes = ["packs/jj"]

[[rigs.overrides]]
agent = "planner"
suspended = false

[[rigs.overrides]]
agent = "worker"
suspended = false

[[rigs.overrides]]
agent = "lander"
suspended = false

[[rigs.overrides]]
agent = "sentinel"
suspended = false

[patches]

[[patches.agent]]
dir = "beads_rust"
name = "planner"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
wake_mode = "resume"
min_active_sessions = 0
max_active_sessions = 1

[[patches.agent]]
dir = "beads_rust"
name = "worker"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
wake_mode = "fresh"
min_active_sessions = 1
max_active_sessions = 4

[[patches.agent]]
dir = "beads_rust"
name = "lander"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
max_active_sessions = 1

[[patches.agent]]
dir = "beads_rust"
name = "sentinel"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
max_active_sessions = 1

[[patches.agent]]
dir = "t3code"
name = "planner"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
wake_mode = "resume"
min_active_sessions = 0
max_active_sessions = 1

[[patches.agent]]
dir = "t3code"
name = "worker"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
wake_mode = "fresh"
min_active_sessions = 1
max_active_sessions = 4

[[patches.agent]]
dir = "t3code"
name = "lander"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
max_active_sessions = 1

[[patches.agent]]
dir = "t3code"
name = "sentinel"
suspended = false
provider = "codex"
append_fragments = ["beads-rust-backend"]
max_active_sessions = 1

[[patches.agent]]
dir = ""
name = "mayor"
suspended = false

[[patches.named_session]]
dir = "beads_rust"
template = "lander"
mode = "always"

[[patches.named_session]]
dir = "beads_rust"
template = "sentinel"
mode = "always"

[[patches.named_session]]
dir = "t3code"
template = "lander"
mode = "always"

[[patches.named_session]]
dir = "t3code"
template = "sentinel"
mode = "always"

[beads]
provider = "exec:gc-beads-br"

[session]
provider = "t3bridge"

[daemon]
formula_v2 = true

[agent_defaults]
append_fragments = ["cass-search", "cm-memory", "agent-mail-secondary", "ubs-scan"]
