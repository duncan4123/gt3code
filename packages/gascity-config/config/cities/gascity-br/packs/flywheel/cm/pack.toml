# CM — CASS Memory System.
#
# Adds the cass-memory MCP catalog entry, prompt guidance, and
# memory/reflection skills to all agents.
# Agents can query a persistent playbook of rules learned from past sessions
# and trigger reflection to extract new insights.
#
# Prerequisites:
#   - cm binary installed and in PATH
#   - cass-memory server running on 127.0.0.1:8766
#   - Start locally with scripts/start-cm.sh.
#
# Usage in your city's pack.toml:
#   [imports.cm]
#   source = "../packs/flywheel/cm"

[pack]
name = "cm"
schema = 2
