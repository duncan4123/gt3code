# MCP Agent Mail — inter-agent messaging via Jeffrey Emmanuel's mail server.
#
# Adds the mcp-agent-mail MCP server catalog entry, prompt guidance, and
# messaging skills to all agents. No agents defined — this is a pure
# enhancement pack.
#
# Prerequisites:
#   - mcp-agent-mail server running on 127.0.0.1:8765.
#   - Start locally with scripts/start-agent-mail.sh.
#   - Localhost auth is handled by the server; set MCP_AGENT_MAIL_TOKEN only if
#     you disable localhost unauthenticated mode.
#
# Usage in your city's pack.toml:
#   [imports.mcp-agent-mail]
#   source = "../packs/flywheel/mcp-agent-mail"

[pack]
name = "mcp-agent-mail"
schema = 2
